services:
  init-permissions:
    image: alpine:3.24
    user: "0:0"
    network_mode: none
    command: >
      sh -c "mkdir -p /mnt/backend-data &&
      chown -R 1001:1001 /mnt/backend-data &&
      chmod -R u+rwX,g+rwX /mnt/backend-data"
    volumes:
      - ./backend/data:/mnt/backend-data:rw,z
    restart: "no"

  ingress:
    image: caddy:2.11.4-alpine
    container_name: newsflow-ingress
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      newsflow:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  newsflow:
    image: newsflow
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    container_name: newsflow
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-${APP_BASE_URL:-http://localhost}}
      TRUST_PROXY: "1"
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      PUBLIC_API_ANONYMOUS_ENABLED: ${PUBLIC_API_ANONYMOUS_ENABLED:-false}
      RSS_MAX_RETRIES: "5"
      RSS_RETRY_DELAY: "2000"
      AI_STORY_GROUPING_ENABLED: ${AI_STORY_GROUPING_ENABLED:-false}
      AI_SUMMARY_GENERATION_ENABLED: ${AI_SUMMARY_GENERATION_ENABLED:-false}
      AI_PODCAST_GENERATION_ENABLED: ${AI_PODCAST_GENERATION_ENABLED:-false}
      SOURCE_REFRESH_ACTIVE_WINDOW_MINUTES: ${SOURCE_REFRESH_ACTIVE_WINDOW_MINUTES:-5}
    volumes:
      - ./backend/data:/usr/src/app/data:rw,z
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app-network:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
