name: Publish Update

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate-services.yml
    with:
      audit: true

  compose-smoke:
    needs: validate
    uses: ./.github/workflows/compose-smoke.yml

  publish:
    name: Publish application image
    runs-on: ubuntu-latest
    needs: [validate, compose-smoke]
    timeout-minutes: 60
    concurrency:
      group: publish-update
      cancel-in-progress: false
    env:
      PRIVATE_REGISTRY_ENDPOINT: ${{ secrets.PRIVATE_REGISTRY_ENDPOINT }}
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.20.0'

      - name: Prepare release since the last publication
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$current_sha" != "$GITHUB_SHA" ]; then
            echo "A newer push supersedes this run; its release will include these commits."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous_tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 1 --json tagName --jq '.[0].tagName // ""')
          node scripts/release-notes.mts --base "$previous_tag" --ref "$GITHUB_SHA" --write

      - name: Set up QEMU
        if: steps.release.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.release.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Prepare image name
        if: steps.release.outputs.publish == 'true'
        id: prep
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          owner=$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          repo=$(printf '%s' "$REPO_NAME" | tr '[:upper:]' '[:lower:]')
          echo "image=${owner}/${repo}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        if: steps.release.outputs.publish == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ steps.prep.outputs.image }}
            name=${{ env.PRIVATE_REGISTRY_ENDPOINT }}/${{ steps.prep.outputs.image }},enable=${{ env.PRIVATE_REGISTRY_ENDPOINT != '' }}
          flavor: latest=false
          tags: |
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=Application image for News Flow in ${{ github.repository }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Log in to GitHub Container Registry
        if: steps.release.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to private registry
        if: steps.release.outputs.publish == 'true' && env.PRIVATE_REGISTRY_ENDPOINT != ''
        uses: docker/login-action@v4
        with:
          registry: ${{ env.PRIVATE_REGISTRY_ENDPOINT }}
          username: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
          password: ${{ secrets.PRIVATE_REGISTRY_PASSWORD }}

      - name: Build and push image
        if: steps.release.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Publish GitHub release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_NOTES_FILE: ${{ steps.release.outputs.notes_file }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$RELEASE_NOTES_FILE" \
            --latest
