name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  INTERNAL_PROXY_TOKEN: ci-internal-proxy-token-at-least-32-chars
  BFF_SESSION_SECRET: ci-bff-session-secret-at-least-32-chars

jobs:
  validate:
    uses: ./.github/workflows/validate-services.yml

  compose-smoke:
    name: Docker Compose Smoke
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Start Compose stack
        env:
          APP_BASE_URL: https://localhost
          OPENROUTER_API_KEY: ''
          PUBLIC_API_ANONYMOUS_ENABLED: 'true'
        run: docker compose up --build --wait -d

      - name: Smoke test Compose stack
        run: |
          backend_port="$(docker compose port backend 5000 2>/dev/null || true)"
          bff_port="$(docker compose port bff 80 2>/dev/null || true)"
          if [ -n "$backend_port" ]; then
            echo "Backend port is unexpectedly published: $backend_port"
            exit 1
          fi
          if [ -n "$bff_port" ]; then
            echo "BFF port is unexpectedly published: $bff_port"
            exit 1
          fi
          curl -kfsS https://localhost/health >/tmp/newsflow-compose-health.json
          curl -kfsS https://localhost/api/public/news >/tmp/newsflow-compose-public-news.json
          curl -kfsS -H 'Content-Type: application/json' \
            -H 'Origin: https://localhost' \
            -c /tmp/newsflow-compose-cookies.txt \
            -d '{"username":"ci-compose-user","password":"secret123"}' \
            https://localhost/api/auth/register >/tmp/newsflow-compose-register.json
          curl -kfsS -b /tmp/newsflow-compose-cookies.txt https://localhost/api/me >/tmp/newsflow-compose-me.json

      - name: Stop Compose stack
        if: always()
        run: docker compose down -v
