name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate-services.yml

  docker-smoke:
    name: Docker Smoke ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - service: bff
            context: .
            dockerfile: ./bff/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Docker Compose configuration
        if: matrix.service == 'bff'
        run: |
          INTERNAL_PROXY_TOKEN=ci-internal-token BFF_SESSION_SECRET=ci-session-secret OPENROUTER_API_KEY= docker compose config

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: newsflow-${{ matrix.service }}:ci
          cache-from: type=gha,scope=ci-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.service }}

      - name: Run backend health check
        if: matrix.service == 'backend'
        run: |
          docker run -d --name newsflow-backend-ci -p 5000:5000 \
            -e INTERNAL_PROXY_TOKEN=ci-internal-token \
            newsflow-backend:ci
          for attempt in {1..30}; do
            if wget -qO- http://127.0.0.1:5000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs newsflow-backend-ci
          exit 1

      - name: Run BFF proxy smoke check
        if: matrix.service == 'bff'
        run: |
          docker build -t newsflow-backend:ci -f ./backend/Dockerfile ./backend
          docker network create newsflow-ci
          docker run -d --name newsflow-backend-ci --network newsflow-ci \
            -e INTERNAL_PROXY_TOKEN=ci-internal-token \
            -e PUBLIC_API_ANONYMOUS_ENABLED=true \
            newsflow-backend:ci
          for attempt in {1..30}; do
            if docker exec newsflow-backend-ci wget -qO- http://127.0.0.1:5000/health; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              docker logs newsflow-backend-ci
              exit 1
            fi
            sleep 1
          done
          docker run -d --name newsflow-bff-ci --network newsflow-ci -p 8080:80 \
            -e INTERNAL_PROXY_TOKEN=ci-internal-token \
            -e BFF_SESSION_SECRET=ci-session-secret \
            -e BACKEND_BASE_URL=http://newsflow-backend-ci:5000 \
            -e APP_BASE_URL=http://127.0.0.1:8080 \
            newsflow-bff:ci
          for attempt in {1..30}; do
            if wget -qO- http://127.0.0.1:8080/api/public/news; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              docker logs newsflow-backend-ci
              docker logs newsflow-bff-ci
              exit 1
            fi
            sleep 1
          done
          curl -fsS -H 'Content-Type: application/json' \
            -c /tmp/newsflow-bff-cookies.txt \
            -d '{"username":"ci-user","password":"secret123"}' \
            http://127.0.0.1:8080/api/auth/register >/tmp/newsflow-register.json
          curl -fsS -b /tmp/newsflow-bff-cookies.txt http://127.0.0.1:8080/api/me >/tmp/newsflow-me.json

      - name: Stop smoke container
        if: always()
        run: |
          docker rm -f newsflow-${{ matrix.service }}-ci newsflow-backend-ci || true
          docker network rm newsflow-ci || true

  compose-smoke:
    name: Docker Compose Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Start Compose stack
        env:
          INTERNAL_PROXY_TOKEN: ci-internal-token
          BFF_SESSION_SECRET: ci-session-secret
          APP_BASE_URL: http://127.0.0.1
          OPENROUTER_API_KEY: ''
          PUBLIC_API_ANONYMOUS_ENABLED: 'true'
        run: docker compose up --build --wait -d

      - name: Smoke test Compose stack
        run: |
          curl -fsS http://127.0.0.1/health >/tmp/newsflow-compose-health.json
          curl -fsS http://127.0.0.1/api/public/news >/tmp/newsflow-compose-public-news.json
          curl -fsS -H 'Content-Type: application/json' \
            -H 'Origin: http://127.0.0.1' \
            -c /tmp/newsflow-compose-cookies.txt \
            -d '{"username":"ci-compose-user","password":"secret123"}' \
            http://127.0.0.1/api/auth/register >/tmp/newsflow-compose-register.json
          curl -fsS -b /tmp/newsflow-compose-cookies.txt http://127.0.0.1/api/me >/tmp/newsflow-compose-me.json

      - name: Stop Compose stack
        if: always()
        env:
          INTERNAL_PROXY_TOKEN: ci-internal-token
          BFF_SESSION_SECRET: ci-session-secret
        run: docker compose down -v
