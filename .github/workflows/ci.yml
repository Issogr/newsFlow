name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.service.name }} on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
        service:
          - name: backend
            working_directory: backend
          - name: bff
            working_directory: bff
          - name: frontend
            working_directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: ${{ matrix.service.working_directory }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.service.working_directory }}
        run: npm ci

      - name: Lint
        working-directory: ${{ matrix.service.working_directory }}
        run: npm run lint

      - name: Build frontend
        if: matrix.service.name == 'frontend'
        working-directory: ${{ matrix.service.working_directory }}
        run: npm run build

      - name: Test
        working-directory: ${{ matrix.service.working_directory }}
        run: npm test

      - name: Audit production dependencies
        working-directory: ${{ matrix.service.working_directory }}
        run: npm audit --omit=dev

  docker-smoke:
    name: Docker Smoke ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - service: bff
            context: .
            dockerfile: ./bff/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: newsflow-${{ matrix.service }}:ci
          cache-from: type=gha,scope=ci-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.service }}

      - name: Run backend health check
        if: matrix.service == 'backend'
        run: |
          docker run -d --name newsflow-backend-ci -p 5000:5000 \
            -e INTERNAL_PROXY_TOKEN=ci-internal-token \
            newsflow-backend:ci
          for attempt in {1..30}; do
            if wget -qO- http://127.0.0.1:5000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs newsflow-backend-ci
          exit 1

      - name: Run BFF health check
        if: matrix.service == 'bff'
        run: |
          docker run -d --name newsflow-bff-ci -p 8080:80 \
            -e INTERNAL_PROXY_TOKEN=ci-internal-token \
            -e BFF_SESSION_SECRET=ci-session-secret \
            -e BACKEND_BASE_URL=http://127.0.0.1:5000 \
            newsflow-bff:ci
          for attempt in {1..30}; do
            if wget -qO- http://127.0.0.1:8080/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs newsflow-bff-ci
          exit 1

      - name: Stop smoke container
        if: always()
        run: docker rm -f newsflow-${{ matrix.service }}-ci || true
